name: Commit Pipeline

on:
  push:
    branches: ['**']
  schedule:
    - cron: '0 2 * * 0'

# CI has no sibling Etch source checkout, so build every project against the published
# Echostorm.Etch package. MSBuild reads this environment variable as a global property, so it
# applies to every dotnet restore/build/test below (Cascade.UI and Cascade.UI.GoldenText swap
# their Etch source project refs for the package when it is 'true').
env:
  UseEtchPackage: 'true'

jobs:
  # ── Build ─────────────────────────────────────────────────────────
  build:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore cascade-ui.sln

      - name: Build
        run: dotnet build cascade-ui.sln -c Release --no-restore -warnaserror

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            src/**/bin/Release/
            tests/**/bin/Release/
          retention-days: 1

  # ── Component Tests ───────────────────────────────────────────────
  component-tests:
    if: github.event_name == 'push'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore cascade-ui.sln

      - name: Build
        run: dotnet build cascade-ui.sln -c Release --no-restore -warnaserror

      - name: Run component tests
        run: dotnet test tests/Cascade.UI.Tests/Cascade.UI.Tests.csproj --no-build -c Release

  # ── Generator Tests ───────────────────────────────────────────────
  generator-tests:
    if: github.event_name == 'push'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore cascade-ui.sln

      - name: Build
        run: dotnet build cascade-ui.sln -c Release --no-restore -warnaserror

      - name: Run generator tests
        run: dotnet test tests/Cascade.Generators.Tests/Cascade.Generators.Tests.csproj --no-build -c Release

  # NOTE: a whole-solution "integration-tests" job used to run here. It ran
  # `dotnet test cascade-ui.sln`, which pulls in the E2E projects (GoldenText,
  # Integration, McpBridge.Tests) that launch a windowed GUI app and need an
  # interactive desktop — impossible on a headless CI runner. Those E2E suites
  # run on a developer desktop (or a future self-hosted desktop runner); CI
  # covers the headless-safe unit tests via component-tests + generator-tests.

  # ── Visual Regression ─────────────────────────────────────────────
  visual-regression:
    if: github.event_name == 'push'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore cascade-ui.sln

      - name: Build
        run: dotnet build cascade-ui.sln -c Release --no-restore -warnaserror

      - name: Run visual regression tests
        run: dotnet test tests/Cascade.UI.Tests/Cascade.UI.Tests.csproj --no-build -c Release --filter "FullyQualifiedName~SnapshotDiff"

  # ── Baseline Drift (weekly schedule) ──────────────────────────────
  baseline-drift:
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore cascade-ui.sln

      - name: Build
        run: dotnet build cascade-ui.sln -c Release --no-restore -warnaserror

      # Unit-test project only (not the whole solution — the E2E projects need a desktop).
      # The wall-clock perf tests self-skip on CI runners (see TestEnv.IsCi); this lane is a
      # placeholder until performance runs on dedicated/self-hosted benchmark hardware.
      - name: Run performance tests
        run: dotnet test tests/Cascade.UI.Tests/Cascade.UI.Tests.csproj --no-build -c Release --filter "FullyQualifiedName~Performance"

      - name: Compare with threshold
        run: echo "Performance baseline comparison complete"
